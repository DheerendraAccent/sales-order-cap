<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Sales Orders</title>
  <style>
    html, body, #content { height: 100%; margin: 0; }
  </style>
  <!-- UI5 from the same CDN as CAP's (working) Fiori preview -->
  <script
    id="sap-ui-bootstrap"
    src="https://sapui5.hana.ondemand.com/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-libs="sap.m, sap.fe.templates"
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"
    data-sap-ui-frameOptions="trusted"
    data-sap-ui-bindingSyntax="complex"
    data-sap-ui-resourceroots='{"salesorders": "./"}'
    data-sap-ui-oninit="module:sap/ui/core/ComponentSupport">
  </script>
</head>
<body class="sapUiBody">
  <div id="content"
    data-sap-ui-component
    data-name="salesorders"
    data-id="container"
    data-height="100%"
    data-settings='{"id":"salesorders"}'>
  </div>
</body>
</html>
